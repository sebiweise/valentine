name: Pages

# Builds the static export and deploys it to GitHub Pages
# (https://<owner>.github.io/<repository>/). Requires Settings → Pages →
# Source "GitHub Actions".

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

# One deployment at a time; a running deployment is not cancelled, so the
# site is never left half-deployed.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Version from "packageManager" in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A project site is served under /<repository>/
      - run: pnpm build
        env:
          NEXT_OUTPUT: export
          BASE_PATH: /${{ github.event.repository.name }}
          NEXT_TELEMETRY_DISABLED: 1

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
