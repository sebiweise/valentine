version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Version updates wait a week: most hijacked releases are pulled within
    # days. Security updates are not delayed by this.
    cooldown:
      default-days: 7
    target-branch: "master"
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # The plugins bundled with eslint-config-next do not support ESLint 10 yet
      - dependency-name: "eslint"
        versions: [">=10"]
      # typescript-eslint (via eslint-config-next) requires TypeScript < 6.1
      - dependency-name: "typescript"
        versions: [">=6.1"]

  # Updates tags and pinned digests of the base images
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/.devcontainer"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    target-branch: "master"

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    target-branch: "master"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    target-branch: "master"
    groups:
      actions:
        patterns:
        - "*"
